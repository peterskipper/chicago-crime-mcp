[project]
name = "chicago-crime-mcp"
version = "0.1.0"
description = "A constrained MCP server over Chicago crime data, backed by an ingest -> store -> serve pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peter Skipper" }]

# Core deps needed for ingestion/exploration (Phase 1). Heavier phases are
# split into optional groups below so early setup stays light.
#
# duckdb is core rather than a `[store]` extra because ingest needs it: the
# `neighborhood` column is a point-in-polygon test derived once at ingest, so a
# backfill cannot run without the spatial extension. Note that `INSTALL spatial`
# reaches the network on first use and caches to `~/.duckdb/extensions`, which
# is why geometry-touching tests stay behind the `integration` marker.
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[project.scripts]
chicago-crime-ingest = "chicago_crime_mcp.ingest.cli:main"
chicago-crime-load = "chicago_crime_mcp.store.postgres.loader:main"
chicago-crime-rollup = "chicago_crime_mcp.store.duckdb.rollups:main"
chicago-crime-server = "chicago_crime_mcp.server.app:main"
chicago-crime-telemetry = "chicago_crime_mcp.telemetry.rollup:main"

[project.optional-dependencies]
# Phase 2 - storage & query routing
store = [
    "psycopg[binary]>=3.2",
    # Pooled connections for the HTTP server: a single psycopg connection is not
    # safe to share across concurrent requests, and a naively pooled one would
    # drop `prepare_threshold=None`. See store.postgres.queries.CONNECT_KWARGS.
    "psycopg-pool>=3.2",
]
# Phase 3 - MCP tool surface
server = [
    "fastmcp>=2.0",
    "pydantic>=2.9",
]
# Phase 4 - the eval harness. A client rather than a server, and the one
# deliberate exception to the server-only scope: it is test tooling. Needs an
# API key and makes real calls, so it never runs in `make ci`.
eval = [
    "anthropic>=0.40",
]
# Dev tooling. pyyaml is here rather than in `eval` because the eval *cases* are
# validated by the offline unit tests -- a case naming a check that does not
# exist would otherwise assert nothing and report a pass.
dev = [
    "mypy>=1.11",
    # Real types for the ingest layer's DataFrame use: pandas keeps its stubs
    # in a separate distribution, so without this every pandas call is opaque.
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chicago_crime_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "UP", "B"]

# Type checking. Deliberately NOT strict: the codebase was annotated as it was
# written but never checked, so the first pass is about finding real defects,
# not about annotating every local. `disallow_untyped_defs` and friends are the
# ratchet to tighten later, one flag at a time, once this baseline holds.
[tool.mypy]
python_version = "3.12"
files = ["src", "evals", "tests", "scripts"]
# The signal that the ratchet is worth turning: an ignore that has stopped
# being needed, or a cast that never was, should fail rather than accumulate.
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Every function must be annotated -- which is also what makes its *body* get
# checked at all, since mypy skips the body of an unannotated function. Free
# here: `src/` and `evals/` already satisfied this on the day it was turned on,
# and `scripts/` needed exactly one annotation. `tests/` is exempt below.
disallow_untyped_defs = true

# pyarrow ships no type information at all -- no `py.typed` marker, no stub
# distribution -- so without this every import of it is an error before any of
# our own code is checked. A whole-library exemption stated in one place, not a
# scatter of `# type: ignore` comments: calls into pyarrow are unchecked. pandas
# is NOT here; `pandas-stubs` is a dev dependency and the ingest layer's
# DataFrame use is checked for real.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# `tests/` is the one exemption, and it is a deliberate trade: annotating 597
# test signatures buys nothing, because what a test asserts is checked by
# running it. Their bodies stay unchecked as a consequence -- measured at 152
# would-be errors, ~129 of them `arg-type` on test doubles that are duck-typed
# on purpose (a `SimpleNamespace` standing in for a `MiddlewareContext`).
# Satisfying those would mean loosening production types to suit the suite.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two kinds of test need something the default run should not assume, and they
# need different things, so they get different markers rather than one blurred
# one: `integration` wants a live Postgres, `spatial` wants DuckDB's spatial
# extension, which downloads on first use and then caches to ~/.duckdb. Both are
# excluded from `make test`, which stays hermetic and offline. Run them
# explicitly with `pytest -m integration` or `pytest -m spatial`.
addopts = "-ra -m 'not integration and not spatial'"
markers = [
    "integration: requires a live Postgres (excluded by default)",
    "spatial: requires DuckDB's spatial extension, which downloads on first use (excluded by default)",
]
