[project]
name = "chicago-crime-mcp"
version = "0.1.0"
description = "A constrained MCP server over Chicago crime data, backed by an ingest -> store -> serve pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peter Skipper" }]

# Core deps needed for ingestion/exploration (Phase 1). Heavier phases are
# split into optional groups below so early setup stays light.
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 2 - storage & query routing
store = [
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]
# Phase 3 - MCP tool surface
server = [
    "fastmcp>=2.0",
    "pydantic>=2.9",
]
# Dev tooling
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chicago_crime_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
