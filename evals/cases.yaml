# Eval cases: one natural-language question, and what a correct run looks like.
#
# The assertions are about tool-call BEHAVIOUR, not prose. What the server can
# influence is which tool a model reaches for, what it puts in the arguments,
# whether an error taught it enough to retry, and whether it read the envelope
# before answering. Phrasing is not graded, with two narrow exceptions:
# answer_contains / answer_omits, used only where the answer is wrong without a
# specific fact -- that a figure covers a wider area than was asked about, or
# that a period is still filling.
#
# Cases are grouped by the affordance each is trying to break. The
# "expected_failure" flag marks cases kept because they are hard, not because
# they are known to pass; they are reported separately and do not fail the run.

- id: aggregate-not-list
  affordance: tool choice
  question: How many burglaries were reported in Chicago in 2023?
  expect:
    calls_tool: [aggregate_incidents]
    avoids_tool: [search_incidents]
    grounded_numbers: true

- id: schema-before-guessing
  affordance: schema discovery
  question: Which category of offense is most common in the Loop, and how many were there last year?
  expect:
    calls_tool: [describe_schema, aggregate_incidents]
    calls_before: [describe_schema, aggregate_incidents]
    grounded_numbers: true

- id: list-is-a-search
  affordance: tool choice
  question: Show me a few recent robbery reports in district 18.
  expect:
    calls_tool: [search_incidents]
    avoids_tool: [aggregate_incidents]
    # Asserted against the filters the envelope echoes back, not against what
    # the model typed. Measured: a real run sent `geography_values: [18]` as an
    # integer, the server normalized it to "018" and answered correctly, and an
    # assertion on the wire form failed a run that did everything right. The
    # normalized value is the contract the envelope actually makes.
    result_filters:
      search_incidents:
        geography: district
        geography_values: ["018"]

- id: point-lookup
  affordance: tool choice
  question: Tell me everything about the incident with id 13209384.
  expect:
    calls_tool: [get_incident]
    avoids_tool: [search_incidents, aggregate_incidents]

- id: radius-is-nearby
  affordance: tool choice
  question: What has been happening within 500 metres of latitude 41.8781, longitude -87.6298?
  expect:
    calls_tool: [nearby_incidents]
    avoids_tool: [search_incidents]
    grounded_numbers: true

# --- entity resolution -------------------------------------------------------
# The headline case. Bronzeville is a real, well-known Chicago neighborhood with
# no boundary of its own, and difflib answers it with "Andersonville" -- 19.4 km
# away, at the opposite end of the city, with a plausible number attached.

- id: bronzeville-resolves-and-reports-the-widening
  affordance: entity resolution
  question: How much crime was there in Bronzeville last year?
  expect:
    calls_tool: [resolve_neighborhood]
    calls_before: [resolve_neighborhood, aggregate_incidents]
    # It has no boundary of its own, so the honest answer names the community
    # area it widened to -- a broader question than the one asked.
    answer_contains: [community area]
    answer_omits: [Andersonville]
    grounded_numbers: true

- id: pilsen-resolves-to-a-community-area
  affordance: entity resolution
  question: Is Pilsen safer than it was three years ago?
  expect:
    calls_tool: [resolve_neighborhood]
    calls_before: [resolve_neighborhood, aggregate_incidents]

- id: named-boundary-answers-exactly
  affordance: entity resolution
  question: How many thefts were there in Wicker Park last year?
  expect:
    calls_tool: [resolve_neighborhood]
    tool_args:
      resolve_neighborhood:
        name: Wicker Park
    grounded_numbers: true

- id: colloquial-spelling-resolves
  affordance: entity resolution
  question: What is the most common offense in Lakeview?
  expect:
    calls_tool: [resolve_neighborhood]
    answer_omits: [could not find, no data for]

- id: invented-place-is-not-answered
  affordance: entity resolution
  question: How many assaults were there in Bridgeporte Heights last year?
  expect:
    calls_tool: [resolve_neighborhood]
    avoids_tool: [aggregate_incidents]
    answer_contains: ["not"]

# --- teaching errors ---------------------------------------------------------
# These questions use a word the data does not: the category is MOTOR VEHICLE
# THEFT, not "carjacking"; there is no "muggings" category. An error is the
# designed path -- the claim under test is that the message was enough to act on.

- id: recovers-from-an-invented-category
  affordance: teaching errors
  question: How many carjackings were there in 2024? Answer with the number, whatever the data calls it.
  expect:
    calls_tool: [aggregate_incidents]
    grounded_numbers: true

- id: recovers-from-a-bad-district
  affordance: teaching errors
  question: How many offenses were reported in police district 1 in 2024?
  expect:
    calls_tool: [aggregate_incidents]
    grounded_numbers: true

# --- taxonomy: the one choice that can flip the sign of an answer ------------
# `stable_category` exists because IUCR code 0760 (BURGLARY FROM MOTOR VEHICLE)
# was re-grouped out of BURGLARY. Measured over the loaded window, citywide
# burglary 2024 -> 2025 reads 8,434 -> 9,741 under taxonomy='source' and
# 7,659 -> 6,213 under 'comparable'. Up 15% or down 19%: the same question, and
# the taxonomy decides the direction.
#
# Nothing warns about it. The coverage-drift warning is bounds-based -- it fires
# for codes introduced or retired inside the span -- and 0760 is present
# throughout, so it stays silent (verified: `warnings: []` in both modes for this
# query). The model therefore has to get here from describe_schema and the
# `taxonomy` argument description alone, which is exactly what these two grade.

- id: comparable-taxonomy-for-a-multi-year-trend
  affordance: schema discovery
  question: Compare burglary in Chicago in 2024 and 2025 on a like-for-like basis, so that changes in how offenses are classified do not distort the comparison.
  expect:
    calls_tool: [aggregate_incidents]
    # The argument's own description says 'comparable' "is the right choice for
    # a multi-year trend". This case is the test of whether that sentence lands.
    tool_args:
      aggregate_incidents:
        taxonomy: comparable
    grounded_numbers: true

- id: taxonomy-basis-is-disclosed-on-a-trend
  affordance: result envelopes
  # Deliberately does NOT mention classification. A bare direction is not an
  # answer here, because the direction depends on a choice the caller never made.
  question: Did burglary in Chicago go up or down between 2024 and 2025?
  # Was marked expected_failure on the reasoning that disclosure has to be
  # volunteered -- no warning fires for this query, so the basis can only come
  # off the envelope's taxonomy_mode field. It passed on the first real run
  # (2026-08-25), so it is a normal case now. The substring remains the
  # brittlest assertion in the suite: a model that says "classification basis"
  # instead is arguably right and would score wrong.
  expect:
    calls_tool: [aggregate_incidents]
    answer_contains: [taxonom]
    grounded_numbers: true

# --- the renamed label -------------------------------------------------------
# `primary_type_canonical` folds CPD's two spellings together (CRIM SEXUAL
# ASSAULT, 6,581 rows, transitioning to CRIMINAL SEXUAL ASSAULT over 2015-2020).
# That fold happens at ingest, so it is an invariant rather than a decision and
# there is nothing for a model to get right -- see the note in the README. The
# one part that IS observable is this: describe_schema names the retired spelling
# in its own prose, so a model can read it there and try to filter on it.

- id: the-retired-label-still-reaches-the-right-rows
  affordance: teaching errors
  question: How many CRIM SEXUAL ASSAULT offenses were reported in Chicago in 2023?
  expect:
    calls_tool: [aggregate_incidents]
    # However it gets there -- its own knowledge, or the teaching error, which
    # does suggest this exact string -- it has to end up on the canonical value.
    # The failure this guards is a confident "there were none".
    tool_args:
      aggregate_incidents:
        types: ["CRIMINAL SEXUAL ASSAULT"]
    grounded_numbers: true

# --- the envelope: warnings a model has to read ------------------------------

- id: does-not-report-a-fake-decline
  affordance: result envelopes
  question: Have thefts gone up or down over the last six months? Give me the monthly numbers.
  expect:
    calls_tool: [aggregate_incidents]
    answer_contains: [incomplete]
    grounded_numbers: true

- id: reports-the-long-run-boundary-caveat
  affordance: result envelopes
  question: Compare offenses in ward 3 between 2016 and 2024.
  expect:
    calls_tool: [aggregate_incidents]
    answer_contains: [boundar]
    grounded_numbers: true

- id: radius-excludes-ungeocoded
  affordance: result envelopes
  question: How many offenses were there within 300 metres of latitude 41.8919, longitude -87.6051, and is that the full count?
  expect:
    calls_tool: [nearby_incidents]
    answer_contains: [coordinates]

# --- bounded results ---------------------------------------------------------

- id: broad-question-degrades-gracefully
  affordance: bounded results
  question: List every theft in Chicago in 2023.
  expect:
    no_error: true
    grounded_numbers: true

- id: does-not-invent-a-total-from-a-page
  affordance: bounded results
  question: List thefts in district 8 last month, then tell me how many there were in total.
  expect:
    calls_tool: [search_incidents]
    grounded_numbers: true

# --- provenance --------------------------------------------------------------

- id: today-is-not-in-the-data
  affordance: result envelopes
  question: How many robberies were there in Chicago yesterday?
  expect:
    # A single substring made this a test of phrasing: a real run stated the
    # caveat correctly and scored a miss for writing it another way.
    answer_contains_any: ["7 day", "7-day", "seven day", "week", "most recent"]
    grounded_numbers: true

- id: counts-offenses-not-crimes
  affordance: result envelopes
  question: How many crimes happened in Austin in 2023? Be precise about what you are counting.
  expect:
    calls_tool: [aggregate_incidents]
    answer_contains: [offense]
    grounded_numbers: true
